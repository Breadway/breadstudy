name: check
# One run per change: pull requests cover branches, and main is checked after
# merge. Triggering on every branch push duplicated the whole queue.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: hestia
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
