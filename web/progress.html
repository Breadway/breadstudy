<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141210">
<title>breadstudy progress</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
<div class="topbar-row">
<a class="brand" href="./index.html" aria-label="breadstudy dashboard">
<span class="brand-mark" aria-hidden="true">b</span>
<span class="brand-text">breadstudy</span>
</a>
<nav class="tabs" aria-label="Primary">
<a href="./index.html">Dashboard</a>
<a href="./session.html">Session</a>
<a href="./progress.html" aria-current="page">Progress</a>
<a href="./teach.html">Teach</a>
</nav>
</div>
</header>
<div id="offline-banner" class="offline-banner" role="status" hidden></div>
<main>
<section class="card" aria-labelledby="mastery-h">
<h2 id="mastery-h">Skill mastery</h2>
<ul class="clean" id="mastery-list">
<li class="muted">Loading mastery.</li>
</ul>
</section>

<section class="card" aria-labelledby="pattern-h">
<h2 id="pattern-h">Recurring error pattern</h2>
<p id="top-pattern" class="muted">Loading attempt history.</p>
</section>

<details class="fold" id="attempts-details">
<summary><span>Attempts</span><span class="fold-meta" id="attempt-summary">Loading attempts.</span></summary>
<div class="fold-body">
<ul class="clean" id="attempt-list">
<li class="muted">Loading attempts.</li>
</ul>
</div>
</details>
</main>
<footer>Read straight from the server: attempts, scheduler and error patterns. Nothing here is a device-local sample.</footer>
<script defer src="./progress.js"></script>
</body>
</html>
